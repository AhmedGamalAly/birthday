<style>
:root{
  --bg:#FFF7EC; --ink:#3B2A5A; --muted:#7A6A93;
  --pink:#FF6B9D; --pink2:#FFB3CF; --blue:#3DA5F4; --blue2:#A9DBFF;
  --yellow:#FFC93C; --mint:#39CDB9; --purple:#9B7BFF; --orange:#FF8A4C;
  --card:#FFFFFF; --shadow:0 10px 30px rgba(59,42,90,.12);
  --r:26px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:'Baloo Bhaijaan 2','Fredoka',system-ui,sans-serif;overflow-x:hidden}
body{min-height:100vh;
  background-image:
    radial-gradient(circle at 12% 18%,rgba(255,107,157,.10) 0 90px,transparent 91px),
    radial-gradient(circle at 88% 30%,rgba(61,165,244,.10) 0 120px,transparent 121px),
    radial-gradient(circle at 20% 80%,rgba(255,201,60,.13) 0 110px,transparent 111px),
    radial-gradient(circle at 85% 85%,rgba(155,123,255,.10) 0 90px,transparent 91px);
  background-attachment:fixed}
button{font-family:inherit;cursor:pointer;border:0}
input,textarea{font-family:inherit}
.display{font-family:'Lalezar','Fredoka',sans-serif;font-weight:400;letter-spacing:0}
html[lang=en] .display{font-family:'Fredoka',sans-serif;font-weight:700}
.num{font-family:'Fredoka',sans-serif}

/* ============ INTRO: GIFT BOX ============ */
#intro{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;
  background:linear-gradient(160deg,#FFE3EE 0%,#FFF3D6 50%,#DDF1FF 100%);transition:opacity .9s ease,visibility .9s}
#intro.gone{opacity:0;visibility:hidden}
.intro-title{font-size:clamp(26px,7vw,40px);text-align:center;color:var(--ink);padding:0 20px;line-height:1.35}
.intro-title span{color:var(--pink)}
.gift{position:relative;width:200px;height:210px;cursor:pointer;animation:bob 2.4s ease-in-out infinite}
.gift:hover{animation-duration:1.2s}
.gift .body{position:absolute;bottom:0;left:10px;width:180px;height:140px;border-radius:14px;
  background:linear-gradient(135deg,var(--pink) 0%,#FF4F8B 100%);box-shadow:inset 0 -12px 0 rgba(0,0,0,.08),0 18px 30px rgba(255,79,139,.35);overflow:hidden}
.gift .body::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:30px;transform:translateX(-50%);background:var(--yellow)}
.gift .body::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(255,255,255,.35) 0 5px,transparent 6px) 0 0/34px 34px}
.gift .lid{position:absolute;top:44px;left:0;width:200px;height:44px;border-radius:12px;z-index:2;
  background:linear-gradient(135deg,#FF7FAA,var(--pink));box-shadow:0 6px 0 rgba(0,0,0,.08);transition:transform .9s cubic-bezier(.3,1.6,.5,1),opacity .9s}
.gift .lid::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:30px;transform:translateX(-50%);background:var(--yellow)}
.bow{position:absolute;top:-46px;left:50%;transform:translateX(-50%);width:120px;height:56px}
.bow i{position:absolute;bottom:0;width:56px;height:46px;border:12px solid var(--yellow);border-radius:50% 50% 10% 50%;background:transparent}
.bow i:first-child{left:4px;transform:rotate(-18deg)}
.bow i:nth-child(2){right:4px;transform:rotate(18deg) scaleX(-1)}
.bow b{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);width:26px;height:26px;border-radius:50%;background:#FFB400}
.gift.open{animation:none}
.gift.open .lid{transform:translate(-40px,-220px) rotate(-38deg);opacity:0}
.gift.shake{animation:shake .45s ease-in-out}
.tap-hint{font-size:20px;font-weight:700;color:#fff;background:var(--purple);padding:12px 26px;border-radius:40px;box-shadow:0 8px 0 #7A5AE0;animation:pulse 1.6s infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-14px) rotate(2deg)}}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(6deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

/* ============ FLOATING BALLOONS BG ============ */
#sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bl{position:absolute;bottom:-160px;width:56px;height:70px;border-radius:50% 50% 48% 48%;opacity:.85;animation:rise linear infinite}
.bl::before{content:"";position:absolute;top:12px;left:12px;width:12px;height:20px;border-radius:50%;background:rgba(255,255,255,.55);transform:rotate(25deg)}
.bl::after{content:"";position:absolute;top:100%;left:50%;width:1.5px;height:70px;background:rgba(59,42,90,.25)}
@keyframes rise{0%{transform:translateY(0) translateX(0) rotate(-4deg)}50%{transform:translateY(-60vh) translateX(22px) rotate(4deg)}100%{transform:translateY(-125vh) translateX(-10px) rotate(-4deg)}}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:120}

/* ============ LAYOUT ============ */
main{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:0 16px 60px}
.bunting{position:relative;height:70px;margin:0 -16px;overflow:hidden}
.bunting svg{width:100%;height:70px;display:block}
.topbar{position:fixed;top:12px;inset-inline-end:12px;z-index:50;display:flex;gap:8px}
.chip{background:#fff;color:var(--ink);font-weight:700;font-size:14px;height:42px;min-width:42px;padding:0 14px;border-radius:21px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;gap:6px}
.chip.on{background:var(--yellow)}

.hero{text-align:center;padding:10px 0 20px}
.hero .pre{display:inline-block;background:#fff;border-radius:30px;padding:6px 18px;font-weight:700;color:var(--purple);box-shadow:var(--shadow);font-size:15px}
.hero h1{font-size:clamp(40px,12vw,68px);line-height:1.15;margin:14px 0 4px;
  background:linear-gradient(90deg,var(--pink),var(--orange),var(--yellow),var(--mint),var(--blue),var(--purple));
  -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(59,42,90,.12))}
.hero p.lead{font-size:18px;color:var(--muted);max-width:480px;margin:0 auto;line-height:1.7}

.kids{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:26px 0 8px}
.kid{position:relative;background:var(--card);border-radius:var(--r);padding:18px 10px 20px;text-align:center;box-shadow:var(--shadow);overflow:hidden}
.kid::before{content:"";position:absolute;inset:0;opacity:.14;background:radial-gradient(circle,currentColor 0 3px,transparent 4px) 0 0/22px 22px}
.kid.zain{color:var(--blue);--c:#3DA5F4;--c2:#1F7FD0} .kid.hana{color:var(--pink);--c:#FF6B9D;--c2:#E83E7C}
.kid .bnum{position:relative;font-family:'Fredoka',sans-serif;font-weight:700;font-size:118px;line-height:1;display:inline-block;
  background:linear-gradient(160deg,#fff -10%,var(--c) 40%,var(--c2) 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 8px 10px rgba(0,0,0,.12));animation:float 3s ease-in-out infinite}
.kid.hana .bnum{animation-delay:-1.5s}
.kid .pic{position:relative;width:min(34vw,170px);aspect-ratio:1;margin:6px auto 10px;border-radius:50%;padding:6px;
  background:conic-gradient(from 200deg,var(--c),var(--yellow),var(--c2),var(--c));animation:float 3.4s ease-in-out infinite}
.kid.hana .pic{animation-delay:-1.7s}
.kid .pic img{width:100%;height:100%;object-fit:cover;border-radius:50%;border:5px solid #fff;display:block;cursor:zoom-in}
.kid .badge{position:absolute;bottom:-6px;inset-inline-end:-6px;width:58px;height:66px;border-radius:50% 50% 48% 48%;
  background:linear-gradient(150deg,#fff -30%,var(--c) 45%,var(--c2));color:#fff;font-family:'Fredoka',sans-serif;font-weight:700;font-size:38px;
  display:flex;align-items:center;justify-content:center;box-shadow:0 6px 12px rgba(0,0,0,.18);border:3px solid #fff}
.kid .badge::after{content:"";position:absolute;top:100%;left:50%;width:2px;height:16px;background:var(--c2);opacity:.6}
.kid .string{display:block;width:2px;height:26px;margin:-6px auto 6px;background:currentColor;opacity:.5;border-radius:2px}
.kid h2{font-size:clamp(21px,6.4vw,30px);white-space:nowrap;color:var(--ink);line-height:1.2}
.kid .age{display:inline-block;margin-top:6px;background:currentColor;border-radius:20px;padding:3px 14px}
.kid .age b{color:#fff;font-weight:700;font-size:15px}
.kid .emo{position:absolute;top:12px;inset-inline-start:12px;font-size:26px}
@keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}

section.card{position:relative;background:var(--card);border-radius:var(--r);padding:24px 20px;margin-top:20px;box-shadow:var(--shadow)}
.sec-title{display:flex;align-items:center;justify-content:center;gap:10px;font-size:clamp(21px,6.2vw,28px);margin-bottom:16px;text-align:center}
.sec-title .ic{font-size:28px}

/* countdown */
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cd div{border-radius:18px;padding:12px 4px;text-align:center;color:#fff}
.cd div:nth-child(1){background:var(--pink)}.cd div:nth-child(2){background:var(--orange)}
.cd div:nth-child(3){background:var(--mint)}.cd div:nth-child(4){background:var(--blue)}
.cd b{display:block;font-family:'Fredoka',sans-serif;font-size:34px;line-height:1.1}
.cd small{font-size:14px;font-weight:600;opacity:.95}
.cd-done{text-align:center;font-size:22px;font-weight:800;color:var(--pink)}

/* details */
.info{display:grid;gap:12px}
.row{display:flex;align-items:center;gap:14px;padding:14px;border-radius:18px;background:#FFF7EC}
.row .ico{flex:0 0 52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px}
.row:nth-child(1) .ico{background:#FFE3EE}.row:nth-child(2) .ico{background:#FFF1CC}.row:nth-child(3) .ico{background:#DDF1FF}
.row small{display:block;color:var(--muted);font-weight:600;font-size:14px}
.row strong{font-size:19px;font-weight:800}
.map{margin-top:14px;border-radius:20px;overflow:hidden;border:4px solid #FFF1CC;height:230px}
.map iframe{width:100%;height:100%;border:0;display:block}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.btn{white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 16px;border-radius:18px;font-weight:800;font-size:17px;color:#fff;text-decoration:none;transition:transform .15s}
.btn:active{transform:translateY(3px)}
.btn.blue{background:var(--blue);box-shadow:0 6px 0 #2B84CC}
.btn.purple{background:var(--purple);box-shadow:0 6px 0 #7A5AE0}
.btn.pink{background:var(--pink);box-shadow:0 6px 0 #E0457A}
.btn.mint{background:var(--mint);box-shadow:0 6px 0 #25A594}
.btn.ghost{background:#F1ECFA;color:var(--ink);box-shadow:0 6px 0 #DCD3EE}
.btn.full{grid-column:1/-1}
.btn[disabled]{opacity:.55;pointer-events:none}

/* rsvp */
.stepper{display:flex;align-items:center;justify-content:center;gap:18px;margin:6px 0 14px}
.stepper button{width:50px;height:50px;border-radius:50%;font-size:28px;font-weight:800;background:var(--yellow);color:var(--ink);box-shadow:0 5px 0 #E0A91A}
.stepper .val{min-width:70px;text-align:center}
.stepper .val b{font-family:'Fredoka';font-size:40px;display:block;line-height:1}
.stepper .val small{color:var(--muted);font-weight:600}
.lbl{display:block;font-weight:700;margin:4px 0 8px;color:var(--muted);text-align:center}
.names{display:grid;gap:10px}
.field{width:100%;padding:14px 16px;border-radius:16px;border:2.5px solid #EDE6F7;background:#FDFBFF;font-size:17px;color:var(--ink);outline:none;transition:border-color .2s}
.field:focus{border-color:var(--purple)}
textarea.field{min-height:96px;resize:vertical}
.note{font-size:14px;color:var(--muted);text-align:center;margin-top:10px}
.ticket-again{margin-top:12px}

/* wish + photo inside RSVP */
.req{color:var(--pink)}
.upload{display:block;margin-top:10px;border:2.5px dashed #D9CCF2;border-radius:18px;background:#FDFBFF;padding:16px;text-align:center;cursor:pointer;transition:border-color .2s}
.upload:hover{border-color:var(--purple)}
.upload input{display:none}
.upload .up-ic{font-size:34px;display:block}
.upload .up-t{font-weight:800}
.upload img{max-width:100%;max-height:260px;border-radius:14px;display:block;margin:0 auto}
.ai-note{display:block;font-size:12px;color:var(--muted);margin-top:6px;text-align:center;opacity:.85}
.rm-photo{margin:8px auto 0;display:block;background:#F1ECFA;color:var(--ink);border-radius:12px;padding:4px 12px;font-size:13px;font-weight:700}
.field.err{border-color:#FF5C5C;animation:shake .4s}
.hero-photo{width:min(78vw,300px);aspect-ratio:1;margin:18px auto 0;border-radius:50%;padding:8px;
  background:conic-gradient(var(--pink),var(--orange),var(--yellow),var(--mint),var(--blue),var(--purple),var(--pink));box-shadow:var(--shadow)}
.hero-photo img{width:100%;height:100%;object-fit:cover;border-radius:50%;border:6px solid #fff;display:block}
.wish .wphoto{width:100%;max-height:340px;object-fit:cover;border-radius:14px;margin-top:10px;display:block;cursor:zoom-in}
#lightbox{position:fixed;inset:0;z-index:130;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;padding:16px}
#lightbox.show{display:flex}
#lightbox img{max-width:100%;max-height:90vh;border-radius:14px}
/* wishes */
.wish-count{display:inline-block;background:#FFE3EE;color:var(--pink);font-weight:800;border-radius:20px;padding:4px 14px;margin-bottom:10px}
.status{font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.status i{width:9px;height:9px;border-radius:50%;background:#ccc;display:inline-block}
.status.ok i{background:#2ECC71}.status.err i{background:#FF5C5C}
.wishes{display:grid;gap:12px;margin-top:16px;max-height:520px;overflow:auto;padding:4px}
.wish{position:relative;border-radius:20px;padding:16px 16px 12px;animation:pop .45s ease}
.wish:nth-child(5n+1){background:#FFE9F1}.wish:nth-child(5n+2){background:#E6F4FF}.wish:nth-child(5n+3){background:#FFF4D6}
.wish:nth-child(5n+4){background:#E3FAF6}.wish:nth-child(5n+5){background:#EFE9FF}
.wish .who{font-weight:800;font-size:17px}
.wish .msg{margin-top:4px;line-height:1.7;white-space:pre-wrap;word-wrap:break-word}
.wish .when{font-size:12px;color:var(--muted);margin-top:4px}
.reacts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.reacts button{background:rgba(255,255,255,.8);border-radius:14px;padding:4px 10px;font-size:15px;font-weight:700;color:var(--ink)}
.reacts button.done{background:#fff;box-shadow:inset 0 0 0 2px var(--purple)}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}

footer{text-align:center;margin-top:34px;color:var(--muted);font-weight:600}
footer .big{font-size:26px;color:var(--ink);margin-bottom:6px}

/* modal */
.modal{position:fixed;inset:0;z-index:110;background:rgba(59,42,90,.55);display:none;align-items:center;justify-content:center;padding:18px}
.modal.show{display:flex}
.sheet{background:#fff;border-radius:28px;padding:24px 20px;width:100%;max-width:380px;text-align:center;animation:pop .35s ease;max-height:92vh;overflow:auto}
.ticket{border:3px dashed var(--pink2);border-radius:22px;padding:16px;margin:14px 0;background:#FFF9FC}
.ticket #qr{display:flex;justify-content:center;margin:10px 0}
.ticket #qr img,.ticket #qr canvas{border-radius:10px;background:#fff;padding:8px}
.ticket .tnames{font-weight:700;margin-top:6px}
.ticket .tcount{display:inline-block;background:var(--mint);color:#fff;font-weight:800;border-radius:14px;padding:3px 12px;margin-top:6px}
.sheet h3{font-size:26px}
.sheet p{color:var(--muted);line-height:1.6}
.sheet .btn{margin-top:10px}

/* scanner / admin */
.tool{max-width:720px;margin:0 auto;padding:20px 16px 60px;position:relative;z-index:1}
.tool h1{font-size:32px;text-align:center;margin:10px 0 16px}
#reader{border-radius:20px;overflow:hidden;background:#000}
.scan-res{margin-top:16px;border-radius:20px;padding:20px;text-align:center;font-size:20px;font-weight:800;display:none}
.scan-res.ok{display:block;background:#DDF8E8;color:#16804A}
.scan-res.warn{display:block;background:#FFF1CC;color:#9A6B00}
.scan-res.bad{display:block;background:#FFE1E1;color:#B42323}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{border-radius:18px;padding:14px;text-align:center;color:#fff}
.stat b{display:block;font-family:'Fredoka';font-size:34px}
.stat:nth-child(1){background:var(--mint)}.stat:nth-child(2){background:var(--blue)}.stat:nth-child(3){background:var(--orange)}.stat:nth-child(4){background:var(--pink)}
.tbl{width:100%;border-collapse:collapse;margin-top:16px;font-size:14px;background:#fff;border-radius:16px;overflow:hidden}
.tbl th,.tbl td{padding:10px 8px;border-bottom:1px solid #F0EAF7;text-align:start}
.tbl th{background:#F5F0FF}
.tbl-wrap{overflow-x:auto;margin-top:6px}
.hidden{display:none!important}

@media (max-width:380px){ .kid .bnum{font-size:96px} .kid h2{font-size:25px} .cd b{font-size:28px} }
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>

/* ================== confetti ================== */
const cv = $("confetti"), cx = cv.getContext("2d"); let parts = [], raf = null;
function sizeCv(){ cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }
addEventListener("resize", sizeCv); sizeCv();
function confetti(n = 160){
  const cols = ["#FF6B9D","#FFC93C","#39CDB9","#3DA5F4","#9B7BFF","#FF8A4C"];
  for (let i = 0; i < n; i++) parts.push({ x: innerWidth/2 + (Math.random()-.5)*120, y: innerHeight*.55, vx:(Math.random()-.5)*14, vy:-Math.random()*16-6,
    s: 6+Math.random()*7, r: Math.random()*6, vr:(Math.random()-.5)*.4, c: cols[i%cols.length], life: 0, round: Math.random() < .3 });
  if (!raf) loop();
}
function loop(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  parts.forEach(p => { p.vy += .38; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life++;
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle = p.c;
    if (p.round){ cx.beginPath(); cx.arc(0,0,p.s/2,0,7); cx.fill(); } else cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);
    cx.restore(); });
  parts = parts.filter(p => p.y < innerHeight + 40 && p.life < 400);
  raf = parts.length ? requestAnimationFrame(loop) : (cx.clearRect(0,0,innerWidth,innerHeight), null);
}

/* photo: resize & compress in the browser so it fits in Firestore (free plan, no Storage needed) */
let photoData = "";
function compress(file){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      let q = .78, max = 900, out = "";
      for (let i = 0; i < 6; i++){
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas"); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        out = c.toDataURL("image/jpeg", q);
        if (out.length < 450000) break;
        max = Math.round(max*.8); q = Math.max(.5, q-.08);
      }
      URL.revokeObjectURL(url); res(out);
    };
    img.onerror = rej; img.src = url;
  });
}

  const f = e.target.files[0]; if (!f) return;

    photoData = await compress(f);

    console.error(e); alert(L("حصلت مشكلة أثناء الحفظ، جرّب تاني","Couldn't save, please try again"));
  } finally { btn.disabled = false; }
}

      ${typeof w.photo === "string" && w.photo.startsWith("data:image/") ? `<img class="wphoto" loading="lazy" src="${w.photo}" alt="">` : ""}
      <div class="when">${fmtWhen(w.ts)}</div>
      <div class="reacts">${REACTS.map(([k,e]) => `<button data-id="${w.id}" data-k="${k}" class="${r[w.id+k]?"done":""}">${e} ${N((w.reactions||{})[k]||0)}</button>`).join("")}</div>
    </div>`).join("");
}
$("wishes").addEventListener("click", e => {
  const im = e.target.closest(".wphoto"); if (!im) return;
  $("lightbox").querySelector("img").src = im.src; $("lightbox").classList.add("show");
});
document.querySelectorAll(".kid .pic img").forEach(im => im.onclick = () => { $("lightbox").querySelector("img").src = im.src; $("lightbox").classList.add("show"); });
$("lightbox").onclick = () => $("lightbox").classList.remove("show");
$("wishes").addEventListener("click", async e => {
  const b = e.target.closest("button[data-id]"); if (!b || !db) return;
  const r = reacted(), key = b.dataset.id + b.dataset.k; if (r[key]) return;
  r[key] = 1; store.set("bday_reacted", JSON.stringify(r)); b.classList.add("done");
  try { await updateDoc(doc(db, CONFIG.wishesCol, b.dataset.id), { ["reactions." + b.dataset.k]: increment(1) }); } catch(err){ console.error(err); }
});
function setStatus(ok){
  const s = $("fbStatus"); s.className = "status " + (ok ? "ok" : "err");
  const sp = s.querySelector("span");
  sp.dataset.ar = ok ? "متصل — الأمنيات بتظهر لحظياً" : "مش متصل حالياً";
  sp.dataset.en = ok ? "Live — wishes appear instantly" : "Offline";
  sp.textContent = sp.dataset[lang];
}

/* ================== scanner ================== */
function startScanner(){
  const s = document.createElement("script");
  s.src = "https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js";
  s.onload = () => {
    const qr = new Html5Qrcode("reader"); let busy = false;
    const res = (cls, html) => { const r = $("scanRes"); r.className = "scan-res " + cls; r.innerHTML = html; };
    qr.start({ facingMode: "environment" }, { fps: 10, qrbox: 240 }, async id => {
      if (busy) return; busy = true;
      try {
        const out = await runTransaction(db, async tx => {
          const ref = doc(db, CONFIG.rsvpCol, id.trim()); const snap = await tx.get(ref);
          if (!snap.exists()) return { k: "bad" };
          const d = snap.data();
          if (d.status !== "confirmed") return { k: "bad", d };
          if ((d.checkedIn||0) >= d.count) return { k: "used", d };
          tx.update(ref, { checkedIn: (d.checkedIn||0) + 1 });
          return { k: "ok", d, n: (d.checkedIn||0) + 1 };
        });
        if (out.k === "ok") res("ok", `✅ أهلاً وسهلاً<br>${esc(out.d.names.join(" • "))}<br>دخول ${arNum(out.n)} من ${arNum(out.d.count)}`);
        else if (out.k === "used") res("warn", `⚠️ التذكرة دي استُخدمت بالكامل<br>${esc(out.d.names.join(" • "))} (${arNum(out.d.count)}/${arNum(out.d.count)})`);
        else res("bad", "❌ تذكرة غير صالحة");
        if (navigator.vibrate) navigator.vibrate(out.k === "ok" ? 120 : [80,60,80]);
      } catch(e){ console.error(e); res("bad", "❌ حصل خطأ في الاتصال"); }
      setTimeout(() => busy = false, 2200);
    }).catch(e => { $("scanRes").className = "scan-res bad"; $("scanRes").textContent = "اسمح باستخدام الكاميرا 📷"; });
  };
  document.head.appendChild(s);
}

/* ================== admin ================== */
let adminRows = [];
function startAdmin(){
  onSnapshot(query(collection(db, CONFIG.rsvpCol), orderBy("ts","desc")), snap => {
    adminRows = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    const conf = adminRows.filter(r => r.status === "confirmed");
    $("aConf").textContent = arNum(conf.reduce((a,r) => a + (r.count||0), 0));
    $("aIn").textContent = arNum(conf.reduce((a,r) => a + (r.checkedIn||0), 0));
    $("aGroups").textContent = arNum(conf.length);
    $("aDecl").textContent = arNum(adminRows.filter(r => r.status === "declined").length);
    $("aBody").innerHTML = adminRows.map((r,i) => `<tr><td>${arNum(i+1)}</td><td>${esc((r.names||[]).join("، "))}</td><td>${arNum(r.count||0)}</td>
      <td>${r.status === "confirmed" ? "✅ حاضر" : "❌ معتذر"}</td><td>${arNum(r.checkedIn||0)}</td><td>${esc(r.wish||"")}${r.hasPhoto?" 📸":""}</td><td>${r.ts?.toDate ? r.ts.toDate().toLocaleString("ar-SA-u-ca-gregory") : ""}</td></tr>`).join("");
  });
  const dl = (name, data, type) => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], { type })); a.download = name; a.click(); };
  $("dlCsv").onclick = () => {
    const q = s => `"${String(s).replace(/"/g,'""')}"`;
    const lines = [["الأسماء","العدد","الحالة","دخلوا","الأمنية","الوقت"].map(q).join(",")].concat(adminRows.map(r =>
      [ (r.names||[]).join(" - "), r.count||0, r.status === "confirmed" ? "حاضر" : "معتذر", r.checkedIn||0, r.wish||"", r.ts?.toDate ? r.ts.toDate().toLocaleString("en-GB") : "" ].map(q).join(",")));
    dl("birthday-rsvps.csv", "\ufeff" + lines.join("\n"), "text/csv;charset=utf-8");
  };
  $("dlWishes").onclick = async () => {
    const s = await getDocs(query(collection(db, CONFIG.wishesCol), orderBy("ts","asc")));
    dl("birthday-wishes.json", JSON.stringify(s.docs.map(d => { const x = d.data(); return { name: x.name, message: x.message, photo: x.photo || "", time: x.ts?.toDate?.().toISOString() || "" }; }), null, 2), "application/json");
  };
}

/* ================== boot ================== */
if (mode === "invite"){
  applyLang();
  if (db){
    onSnapshot(query(collection(db, CONFIG.wishesCol), orderBy("ts","desc")),
      snap => { wishes = snap.docs.map(d => ({ id: d.id, ...d.data() })); setStatus(true); renderWishes(); },
      err => { console.error(err); setStatus(false); });
  } else setStatus(false);
} else {
  $("intro").remove(); $("app").classList.add("hidden"); $("topbar").classList.add("hidden");
  if (mode === "scan"){ $("scanView").classList.remove("hidden"); startScanner(); }
  else { $("adminView").classList.remove("hidden"); startAdmin(); }
}
</script>
